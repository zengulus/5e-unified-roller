<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="manifest" href="manifest.json">
    <title>Campaign Ledger</title>
    <link rel="stylesheet" href="css/theme.css?v=20260304f">
    <link rel="stylesheet" href="css/player-nav.css?v=20260305d">
    <link rel="stylesheet" href="css/ledger.css?v=20260304b">
</head>

<body data-player-nav="ledger">
    <canvas id="vector-cloud"></canvas>

    <div class="container">
        <header class="hero-header">
            <div>
                <p class="hero-eyebrow">Ravnica Task Force</p>
                <h1>Campaign Ledger</h1>
                <p class="hero-subtitle">Pin immutable facts your table has locked in as true so they stay visible across cases, people, places, and events.</p>
            </div>
            <div class="hero-actions">
                <div class="hero-action-bar primary">
                    <a class="hero-btn ghost" href="timeline.html">Timeline</a>
                    <a class="hero-btn ghost" href="board.html">Board</a>
                </div>
                <div class="hero-action-bar secondary">
                    <button class="hero-btn ghost" data-onclick="triggerAccentPicker()">🎨 Accent</button>
                    <button class="hero-btn ghost" id="btn-bg-style" data-onclick="cycleBgStyle()">🌌 BG: Field</button>
                </div>
                <input type="color" id="accent-picker-input"
                    class="ledger-accent-picker-input" data-onchange="setAccentColor(this.value)">
            </div>
        </header>

        <section class="card">
            <h2>Pin Fact</h2>
            <div class="ledger-form-grid">
                <div class="ledger-field ledger-field-wide">
                    <label>Fact Statement</label>
                    <textarea id="ledgerStatement" rows="2" placeholder="Write a hard, unchanging fact."></textarea>
                </div>
                <div class="ledger-field">
                    <label>Case</label>
                    <select id="ledgerCase" data-onchange="refreshLedgerSourcePicker()"></select>
                </div>
                <div class="ledger-field">
                    <label>Fact Type</label>
                    <select id="ledgerSourceType" data-onchange="refreshLedgerSourcePicker()">
                        <option value="case">Case</option>
                        <option value="event">Event</option>
                        <option value="npc">NPC</option>
                        <option value="location">Location</option>
                        <option value="theory">Theory</option>
                        <option value="clue">Clue</option>
                        <option value="requisition">Requisition</option>
                        <option value="other">Other</option>
                    </select>
                </div>
                <div class="ledger-field">
                    <label>Linked Record</label>
                    <input id="ledgerSourceId" type="text" list="ledgerSourceOptions" placeholder="Filter and select a record">
                    <datalist id="ledgerSourceOptions"></datalist>
                </div>
                <div class="ledger-field ledger-field-wide">
                    <label>Tags</label>
                    <input id="ledgerTags" type="text" placeholder="casefile, witness, timeline">
                </div>
                <div class="ledger-field ledger-field-wide">
                    <label>Notes</label>
                    <textarea id="ledgerNotes" rows="2" placeholder="Context, caveats, supporting detail."></textarea>
                </div>
            </div>
            <div class="ledger-form-actions">
                <button class="btn btn-dp" data-onclick="createLedgerEntry()">Pin Fact</button>
            </div>
        </section>

        <section class="card">
            <h2>Pinned Facts</h2>
            <div class="ledger-filter-grid">
                <div class="ledger-field">
                    <label>Search</label>
                    <input id="ledgerSearch" type="text" placeholder="statement, tags, notes, linked record"
                        data-oninput="onLedgerFilterChange()">
                </div>
                <div class="ledger-field">
                    <label>Case Filter</label>
                    <select id="ledgerFilterCase" data-onchange="onLedgerFilterChange()"></select>
                </div>
                <div class="ledger-field">
                    <label>Fact Type Filter</label>
                    <select id="ledgerFilterSource" data-onchange="onLedgerFilterChange()">
                        <option value="all">All</option>
                        <option value="case">Case</option>
                        <option value="event">Event</option>
                        <option value="npc">NPC</option>
                        <option value="location">Location</option>
                        <option value="theory">Theory</option>
                        <option value="clue">Clue</option>
                        <option value="requisition">Requisition</option>
                        <option value="other">Other</option>
                    </select>
                </div>
                <div class="ledger-field">
                    <label>Sort</label>
                    <select id="ledgerSort" data-onchange="onLedgerFilterChange()">
                        <option value="updated_desc">Recently Updated</option>
                        <option value="updated_asc">Oldest Updated</option>
                        <option value="statement_asc">Fact A-Z</option>
                        <option value="statement_desc">Fact Z-A</option>
                        <option value="source">Fact Type</option>
                    </select>
                </div>
            </div>
            <div id="ledgerSummary" class="ledger-summary">Loading entries...</div>
            <div id="ledgerList" class="ledger-list"></div>
        </section>

        <section class="card">
            <h2>Case Fact Digest</h2>
            <div id="ledgerStableSummary" class="ledger-summary">No pinned facts yet.</div>
            <div id="ledgerStableFacts" class="stable-facts-list"></div>
            <div class="ledger-form-actions">
                <button class="btn" data-onclick="copyStableFacts()">Copy Facts</button>
                <button class="btn btn-dp" data-onclick="exportStableFacts()">Export Facts</button>
            </div>
        </section>
    </div>

    <script src="js/delegated-handler.js"></script>
    <script src="js/sw-register.js"></script>
    <script src="js/data-guilds.js"></script>
    <script src="js/data-setting.js"></script>
    <script src="js/data.js"></script>
    <script src="js/store.js?v=20260304c"></script>
    <script src="js/player-nav.js?v=20260305h"></script>
    <script src="js/vector-field.js"></script>
    <script src="js/ledger.js?v=20260305a"></script>
</body>

</html>
