<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="manifest" href="manifest.json">
    <title>Campaign Timeline</title>
    <link rel="stylesheet" href="css/theme.css?v=20260304f">
    <link rel="stylesheet" href="css/hub.css?v=20260222a">
    <link rel="stylesheet" href="css/player-nav.css?v=20260305d">
    <link rel="stylesheet" href="css/timeline.css?v=20260304b">
</head>

<body data-player-nav="campaign-timeline">
    <canvas id="vector-cloud"></canvas>

    <div class="container">
        <header class="hero-header">
            <div>
                <p class="hero-eyebrow">Ravnica Task Force</p>
                <h1>Campaign Timeline</h1>
                <p class="hero-subtitle">Campaign-level timeline for cross-case beats, blockers, and coordination state.</p>
            </div>
            <div class="hero-actions">
                <div class="hero-action-bar primary">
                    <button class="hero-btn accent" data-onclick="toggleEventForm()">+ Log Event</button>
                </div>
                <div class="hero-action-bar secondary">
                    <button class="hero-btn ghost" data-onclick="triggerAccentPicker()">🎨 Accent</button>
                    <button class="hero-btn ghost" id="btn-bg-style" data-onclick="cycleBgStyle()">🌌 BG: Field</button>
                </div>
                <input type="color" id="accent-picker-input"
                    class="tl-accent-picker-input" data-onchange="setAccentColor(this.value)">
            </div>
        </header>

        <div class="card">
            <div id="eventForm" class="event-form">
                <input type="text" id="eventTitle" placeholder="Operation / Event *">
                <div class="event-meta">
                    <div>
                        <label>Focus / District</label>
                        <input type="text" id="eventFocus" placeholder="Precinct, Guild, District">
                    </div>
                    <div>
                        <label>Deadline</label>
                        <input type="datetime-local" id="eventDueAt">
                    </div>
                    <div>
                        <label>Heat Δ</label>
                        <input type="number" id="eventHeat" placeholder="0">
                    </div>
                    <div>
                        <label>Severity</label>
                        <select id="eventImpactSeverity">
                            <option value="low">Low</option>
                            <option value="moderate" selected>Moderate</option>
                            <option value="high">High</option>
                            <option value="critical">Critical</option>
                        </select>
                    </div>
                    <div>
                        <label>Scope</label>
                        <select id="eventImpactScope">
                            <option value="local" selected>Local</option>
                            <option value="district">District</option>
                            <option value="guildwide">Guildwide</option>
                            <option value="citywide">Citywide</option>
                        </select>
                    </div>
                    <div>
                        <label>Certainty (0-100)</label>
                        <input type="number" id="eventCertainty" min="0" max="100" step="1" value="50">
                    </div>
                    <div>
                        <label>Tags</label>
                        <input type="text" id="eventTags" placeholder="stakeout, dimir, chase">
                    </div>
                    <div>
                        <label>Image URL</label>
                        <input type="url" id="eventImageUrl" placeholder="https://...">
                    </div>
                </div>
                <div class="impact-editor">
                    <label>Impacted Entities</label>
                    <div class="impact-editor-row">
                        <select id="eventImpactType" data-onchange="updateDraftImpactIdOptions()">
                            <option value="npc">NPC</option>
                            <option value="location">Location</option>
                            <option value="requisition">Requisition</option>
                            <option value="event">Timeline Event</option>
                        </select>
                        <select id="eventImpactId"></select>
                        <input type="text" id="eventImpactNote" placeholder="Impact note (optional)">
                        <button class="btn" type="button" data-onclick="addDraftEntityImpact()">Add Impact</button>
                    </div>
                    <div class="impact-quick-row" id="eventImpactQuickRow"></div>
                    <div class="impact-chip-row" id="eventImpactList"></div>
                </div>
                <div class="event-body">
                    <textarea id="eventHighlights" placeholder="Highlights / Beats"></textarea>
                    <textarea id="eventFallout" placeholder="Fallout / Consequences"></textarea>
                    <textarea id="eventFollow" placeholder="Debrief / Follow Ups"></textarea>
                </div>
                <div class="tl-form-actions">
                    <button class="btn btn-dp" data-onclick="addTimelineEvent()">Save Event</button>
                </div>
            </div>

            <div class="filter-bar">
                <div class="filter-row">
                    <input type="text" id="eventSearch" placeholder="Search title, notes, tags" data-oninput="renderTimeline()">
                    <select id="eventFocusFilter" data-onchange="renderTimeline()">
                        <option value="">All Focuses</option>
                    </select>
                    <select id="eventSort" data-onchange="renderTimeline()">
                        <option value="newest">Newest First</option>
                        <option value="oldest">Oldest First</option>
                        <option value="heat">By Heat Impact</option>
                    </select>
                </div>
                <div class="filter-row actions">
                    <div class="filter-toggles">
                        <button class="toggle-btn" id="eventImpactOnly" type="button" aria-pressed="false"
                            data-onclick="toggleFilterButton(this, renderTimeline)">Heat / Fallout only</button>
                        <button class="toggle-btn" id="eventOverdueOnly" type="button" aria-pressed="false"
                            data-onclick="toggleFilterButton(this, renderTimeline)">Overdue only</button>
                        <button class="toggle-btn" id="eventAutoHeat" type="button" aria-pressed="false"
                            data-onclick="toggleAutoHeat(this)">Auto-sync Heat</button>
                        <button class="toggle-btn" id="eventHideResolved" type="button" aria-pressed="false"
                            data-onclick="toggleFilterButton(this, renderTimeline)">Hide Resolved</button>
                    </div>
                    <div class="filter-actions">
                        <button class="btn btn-dp" id="exportRecapBtn" data-onclick="exportTimelineRecap()">Export Recap</button>
                    </div>
                </div>
            </div>

            <div class="timeline-wrapper" id="timelineList"></div>
        </div>
    </div>

    <script src="js/delegated-handler.js"></script>
    <script src="js/sw-register.js"></script>
    <script src="js/data-guilds.js"></script>
    <script src="js/data-setting.js"></script>
    <script src="js/data.js"></script>
    <script src="js/store.js?v=20260305a"></script>
    <script src="js/player-nav.js?v=20260305g"></script>
    <script src="js/soft-delete.js"></script>
    <script src="js/vector-field.js"></script>
    <script>window.RTF_VIEW_SCOPE = 'campaign';</script>
    <script src="js/timeline.js?v=20260305b"></script>
</body>

</html>
