<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="manifest" href="manifest.json">
    <title>Light VTT</title>
    <meta name="theme-color" content="#1e1e1e">
    <link rel="stylesheet" href="css/theme.css?v=20260222e">
    <link rel="stylesheet" href="css/player-nav.css?v=20260320b">
    <link rel="stylesheet" href="css/vtt.css?v=20260320b">
</head>

<body data-player-nav="vtt">
    <canvas id="vector-cloud"></canvas>

    <header class="hero-header vtt-topbar">
        <div class="vtt-topbar-group">
            <button class="hero-btn ghost" data-action="toggle-settings" id="vtt-settings-toggle"
                aria-controls="vtt-settings-panel" aria-expanded="true">Hide Settings</button>
            <button class="hero-btn ghost" data-action="toggle-initiative" id="vtt-initiative-toggle"
                aria-controls="vtt-initiative-panel" aria-expanded="true">Hide Initiative</button>
            <a class="hero-btn ghost" href="index.html">Character Sheet</a>
            <span class="vtt-topbar-case">Case <strong id="vtt-case-name">Primary Case</strong></span>
            <span class="vtt-sync-chip" id="vtt-sync-chip">Local</span>
        </div>
        <div class="vtt-topbar-group vtt-topbar-group-right">
            <button class="hero-btn ghost" data-action="toggle-role" id="vtt-role-toggle">Role: DM</button>
            <button class="hero-btn ghost" data-action="zoom-out">-</button>
            <button class="hero-btn ghost" data-action="zoom-reset">100%</button>
            <button class="hero-btn ghost" data-action="zoom-in">+</button>
            <button class="hero-btn ghost" data-action="fit-view">Fit</button>
            <button class="hero-btn ghost" data-onclick="triggerAccentPicker()">🎨 Accent</button>
            <button class="hero-btn ghost" id="btn-bg-style" data-onclick="cycleBgStyle()">🌌 BG: Field</button>
            <input type="color" id="accent-picker-input" class="vtt-accent-picker-input"
                data-onchange="setAccentColor(this.value)">
        </div>
    </header>

    <main class="vtt-shell">
        <aside class="vtt-sidebar" id="vtt-settings-panel">
            <section class="vtt-panel" data-dm-only="1">
                <div class="vtt-panel-head">
                    <h2>Scene</h2>
                    <span class="vtt-panel-pill" id="vtt-active-scene-label">Scene 1</span>
                </div>
                <label class="vtt-field">
                    <span>Map Image URL</span>
                    <input type="text" id="scene-map-url" data-scene-field="mapImageUrl" placeholder="https://...">
                </label>
                <div class="vtt-field-grid">
                    <label class="vtt-field">
                        <span>Grid Cell PX</span>
                        <input type="number" id="scene-grid-cell" data-scene-grid-field="cellPx" min="24" max="240">
                    </label>
                    <label class="vtt-field">
                        <span>Cell Distance</span>
                        <input type="number" id="scene-grid-distance" data-scene-grid-field="cellDistance" min="1" max="1000">
                    </label>
                    <label class="vtt-field">
                        <span>Offset X</span>
                        <input type="number" id="scene-grid-offset-x" data-scene-grid-field="offsetX">
                    </label>
                    <label class="vtt-field">
                        <span>Offset Y</span>
                        <input type="number" id="scene-grid-offset-y" data-scene-grid-field="offsetY">
                    </label>
                </div>
                <div class="vtt-chip-row">
                    <button class="vtt-chip-btn" data-action="step-grid-cell" data-delta="-4">Cell -</button>
                    <button class="vtt-chip-btn" data-action="step-grid-cell" data-delta="4">Cell +</button>
                    <button class="vtt-chip-btn" data-action="reset-grid-offset">Reset Offset</button>
                </div>
                <div class="vtt-chip-row">
                    <button class="vtt-chip-btn" data-action="nudge-grid" data-axis="x" data-delta="-1">X-</button>
                    <button class="vtt-chip-btn" data-action="nudge-grid" data-axis="x" data-delta="1">X+</button>
                    <button class="vtt-chip-btn" data-action="nudge-grid" data-axis="y" data-delta="-1">Y-</button>
                    <button class="vtt-chip-btn" data-action="nudge-grid" data-axis="y" data-delta="1">Y+</button>
                </div>
                <div class="vtt-detail-note">Calibrate fast: adjust cell size, then nudge X and Y until the grid lands on the map.</div>
            </section>

            <section class="vtt-panel" data-dm-only="1">
                <div class="vtt-panel-head">
                    <h2>Spawn</h2>
                    <button class="vtt-chip-btn" data-action="add-custom-token">Custom Token</button>
                </div>
                <div class="vtt-roster-block">
                    <div class="vtt-subhead">Players</div>
                    <div class="vtt-roster-list" id="vtt-player-spawn-list"></div>
                </div>
                <div class="vtt-roster-block">
                    <div class="vtt-subhead">NPCs</div>
                    <div class="vtt-roster-list" id="vtt-npc-spawn-list"></div>
                </div>
            </section>

            <section class="vtt-panel">
                <div class="vtt-panel-head">
                    <h2>Token Inspector</h2>
                    <span class="vtt-panel-pill" id="vtt-selection-pill">No Token</span>
                </div>
                <div id="vtt-token-inspector"></div>
            </section>
        </aside>

        <section class="vtt-stage-panel">
            <div class="vtt-stage-toolbar">
                <div>
                    <strong id="vtt-stage-title">Scene 1</strong>
                    <span class="vtt-stage-meta" id="vtt-stage-meta">Drag empty space to pan. Scroll or use buttons to zoom.</span>
                </div>
            </div>
            <div class="vtt-stage" id="vtt-stage">
                <div class="vtt-world" id="vtt-world">
                    <img id="vtt-map-image" class="vtt-map-image" alt="">
                    <div class="vtt-grid-layer" id="vtt-grid-layer"></div>
                    <div class="vtt-fog-layer" id="vtt-fog-layer"></div>
                    <div class="vtt-token-layer" id="vtt-token-layer"></div>
                </div>
            </div>
        </section>

        <aside class="vtt-initiative-panel" id="vtt-initiative-panel">
            <section class="vtt-panel">
                <div class="vtt-panel-head">
                    <h2>Initiative</h2>
                    <span class="vtt-panel-pill" id="vtt-round-pill">Round 1</span>
                </div>
                <div class="vtt-initiative-toolbar">
                    <button class="vtt-chip-btn" data-action="prev-turn">Prev</button>
                    <button class="vtt-chip-btn strong" data-action="next-turn">Next</button>
                </div>
                <div class="vtt-initiative-list" id="vtt-initiative-list"></div>
            </section>

            <section class="vtt-panel" id="vtt-initiative-detail-panel"></section>
        </aside>
    </main>

    <script src="js/delegated-handler.js"></script>
    <script src="js/sw-register.js"></script>
    <script src="js/store.js?v=20260320a"></script>
    <script src="js/player-nav.js?v=20260320b"></script>
    <script src="js/vector-field.js?v=20260224g"></script>
    <script src="js/vtt.js?v=20260320b"></script>
</body>

</html>
