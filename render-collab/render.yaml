services:
  - type: web
    name: rtf-collab-relay
    env: node
    plan: free
    rootDir: render-collab
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /healthz
    envVars:
      - key: SERVICE_NAME
        value: RTF collab relay
      - key: ALLOWED_ORIGINS
        sync: false
